[phases.setup]
nixPkgs = ["nodejs_22", "bun"]

[build]
buildCommand = "bun install && bun run build"

[deploy]
# Off until the US site is needed again. Not an always-on server.
cronSchedule = "0 0 1 1 *"
startCommand = "echo 'omuzbox-us web disabled' && exit 0"
restartPolicyType = "NEVER"
restartPolicyMaxRetries = 1
